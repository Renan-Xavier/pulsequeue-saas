name: PulseQueue CI — Lint, Unit, Build & Playwright E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Full Stack CI (PostgreSQL 16 + Vitest + Next Build + Playwright E2E)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulsequeue
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulsequeue
      BETTER_AUTH_SECRET: ci-test-secret-key-minimum-32-characters-long
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Push Drizzle schema & seed PostgreSQL
        run: |
          npm run db:push -- --force
          npm run db:seed

      - name: Production Next.js build
        run: npm run build

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite against real Next.js + PostgreSQL
        run: npx playwright test
